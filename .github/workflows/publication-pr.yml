name: Create publication PR

on:
  push:
    branches:
      - publish/materials

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Create pull request if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING_PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "publish/materials" \
            --base "master" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "Publication PR #$EXISTING_PR already exists."
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --head "publish/materials" \
              --base "master" \
              --title "Publish course materials" \
              --body "Automated publication from the private course repository."
          fi
